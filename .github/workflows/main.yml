name: Sync and Build .NET 10
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4 # 修复: v4 是当前最新稳定版本
        with:
          fetch-depth: 0

      - name: Sync from GitGud (Merge Mode)
        id: sync_step
        shell: pwsh
        env:
          SOURCE_REPO: https://gitgud.io/rewio/S4A21GmTool.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git remote add upstream $env:SOURCE_REPO 2>$null
          git fetch upstream
          
          $upstreamInfo = git remote show upstream
          $upstreamBranch = "master"
          foreach ($line in $upstreamInfo) {
              if ($line -match "HEAD branch:\s*(\S+)") {
                  $upstreamBranch = $matches[1]
                  break
              }
          }
          
          git checkout $upstreamBranch 2>$null
          if ($LASTEXITCODE -ne 0) { git checkout -b $upstreamBranch }
          
          $beforeHash = git rev-parse HEAD
          
          git merge "upstream/$upstreamBranch" -m "chore: sync from GitGud" --allow-unrelated-histories -X theirs
          
          if ($LASTEXITCODE -ne 0) {
              echo "Merge failed. Aborting."
              git merge --abort
              exit 1
          }
          
          $afterHash = git rev-parse HEAD
          
          echo "commit_hash=$($afterHash.Substring(0,7))" >> $env:GITHUB_OUTPUT
          
          $hasUpdates = $beforeHash -ne $afterHash
          
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
              echo "Manual trigger detected. Forcing build and release."
              $hasUpdates = $true
          }

          if ($hasUpdates) {
              echo "has_new_commits=true" >> $env:GITHUB_OUTPUT
              git push origin $upstreamBranch
              git push origin --tags
          } else {
              echo "has_new_commits=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup .NET 10
        if: steps.sync_step.outputs.has_new_commits == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview' # 修复: .NET 10 正式发布前必须指定 preview

      - name: Build with Native dotnet CLI
        if: steps.sync_step.outputs.has_new_commits == 'true'
        shell: cmd
        run: |
          dotnet publish DfoGmToolA21.sln ^
            -c Release ^
            -r win-x64 ^
            --self-contained false ^
            -p:UseSystemResourceKeys=true ^
            -p:InvariantGlobalization=true ^
            -p:StripSymbols=true ^
            -p:DebugType=none ^
            -o dist\win-x64

      - name: Copy wwwroot to Build Output
        if: steps.sync_step.outputs.has_new_commits == 'true'
        shell: pwsh
        run: |
          # 修复: 修正拼写错误 'ddist'，并添加 -Recurse -Force 以确保目录被正确递归复制
          if (Test-Path wwwroot) {
              Copy-Item -Path wwwroot -Destination dist\win-x64\wwwroot -Recurse -Force
          }

      - name: Compress Build Output
        if: steps.sync_step.outputs.has_new_commits == 'true'
        shell: pwsh
        run: |
          # 修复: 重命名步骤以避免与上一步名称重复
          Compress-Archive -Path dist\win-x64\* -DestinationPath DfoServer-win-x64.zip -Force

      - name: Create Release
        if: steps.sync_step.outputs.has_new_commits == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sync_step.outputs.commit_hash }}
          name: Auto Build ${{ steps.sync_step.outputs.commit_hash }}
          draft: false
          prerelease: false
          files: |
            DfoServer-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
